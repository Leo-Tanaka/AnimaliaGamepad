<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Controle do Carrinho</title>
  <meta name="theme-color" content="#0F1216" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <button id="status-bar" class="status-bar" type="button">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-label" class="status-label">toque para conectar</span>
      <span id="status-device" class="status-device"></span>
    </button>

    <!-- ---------- Modo 1: direcional (d-pad) ---------- -->
    <section id="tela-dpad" class="screen ativa">
      <header class="marca">
        <img class="marca-logo marca-animalia" src="img/logo-animalia.png" alt="Animalia" />
        <span class="marca-divisor" aria-hidden="true"></span>
        <img class="marca-logo marca-ff" src="img/logo-future-fest.png" alt="Future Fest" />
        <button id="btn-ajustes" class="botao-config" type="button" aria-label="Ajustar movimentos">
          <span aria-hidden="true">&#9881;</span>
        </button>
      </header>

      <div class="dpad-linha">
        <div class="dpad-area">
          <div class="dpad">
            <button class="dpad-botao dpad-cima" data-comando="F" aria-label="Frente">▲</button>
            <button class="dpad-botao dpad-esquerda" data-comando="E" aria-label="Esquerda">◀</button>
            <div class="dpad-centro" aria-hidden="true"></div>
            <button class="dpad-botao dpad-direita" data-comando="D" aria-label="Direita">▶</button>
            <button class="dpad-botao dpad-baixo" data-comando="T" aria-label="Trás">▼</button>
          </div>
        </div>

        <div class="modo-area">
          <button id="btn-alternar-modo" class="botao-alternar-modo" aria-label="Mudar para modo de blocos">
            <span class="icone-blocos" aria-hidden="true">▤</span>
            <span class="rotulo-alternar">blocos</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ---------- Modo 2: blocos de comando (estilo Scratch) ---------- -->
    <section id="tela-blocos" class="screen">
      <div class="blocos-topo">
        <span class="blocos-titulo">monte a sequência</span>
        <button id="btn-voltar-dpad" class="botao-voltar" aria-label="Voltar para o direcional">◀ direcional</button>
      </div>

      <div class="paleta-wrap">
        <p class="secao-rotulo">paleta</p>
        <div id="paleta" class="lista-blocos paleta">
          <div class="bloco" data-comando="F"><span class="bloco-seta" aria-hidden="true">▲</span>frente</div>
          <div class="bloco" data-comando="T"><span class="bloco-seta" aria-hidden="true">▼</span>trás</div>
          <div class="bloco" data-comando="E"><span class="bloco-seta" aria-hidden="true">◀</span>esquerda</div>
          <div class="bloco" data-comando="D"><span class="bloco-seta" aria-hidden="true">▶</span>direita</div>
        </div>
      </div>

      <div class="sequencia-wrap">
        <p class="secao-rotulo">sequência <span id="contagem-sequencia">(0 passos)</span></p>
        <div id="sequencia" class="lista-blocos sequencia">
          <p class="sequencia-vazia">arraste blocos da paleta para cá</p>
        </div>
      </div>

      <div class="acoes-blocos">
        <button id="btn-apagar" class="botao-secundario">apagar</button>
        <button id="btn-enviar" class="botao-primario">enviar sequência ▸</button>
      </div>
    </section>

    <!-- ---------- Ajustes: qual movimento cada seta realmente faz ---------- -->
    <section id="tela-ajustes" class="screen">
      <div class="blocos-topo">
        <span class="blocos-titulo">ajustar movimentos</span>
        <button id="btn-voltar-ajustes" class="botao-voltar" aria-label="Voltar para o direcional">&#9664; direcional</button>
      </div>

      <p class="ajustes-ajuda">
        Se o carrinho vai para o lado errado, troque aqui o que cada seta faz &mdash;
        sem precisar mexer nos fios da ponte H.
      </p>

      <div id="lista-ajustes" class="lista-ajustes"></div>

      <p id="aviso-ajustes" class="aviso-ajustes" hidden></p>

      <div class="log-wrap">
        <p class="secao-rotulo">registro de comandos</p>
        <div id="status-log" class="status-log" role="log" aria-live="polite"></div>
      </div>

      <div class="acoes-blocos">
        <button id="btn-restaurar" class="botao-secundario">restaurar padr&atilde;o</button>
      </div>
    </section>
  </div>
</body>
</html>
