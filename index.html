<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Controle do Carrinho</title>
  <meta name="theme-color" content="#14171C" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="status-bar">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-label" class="status-label">Desconectado</span>
      <span id="status-device" class="status-device"></span>
    </header>

    <!-- ---------- Modo 1: direcional (d-pad) ---------- -->
    <section id="tela-dpad" class="screen ativa">
      <div class="dpad-area">
        <div class="dpad">
          <button class="dpad-botao dpad-cima" data-comando="F" aria-label="Frente">▲</button>
          <button class="dpad-botao dpad-esquerda" data-comando="E" aria-label="Esquerda">◀</button>
          <div class="dpad-centro"></div>
          <button class="dpad-botao dpad-direita" data-comando="D" aria-label="Direita">▶</button>
          <button class="dpad-botao dpad-baixo" data-comando="T" aria-label="Trás">▼</button>
        </div>
      </div>

      <div class="modo-area">
        <button id="btn-alternar-modo" class="botao-alternar-modo" aria-label="Mudar para modo de blocos">
          <span class="icone-blocos">▤</span>
          <span class="rotulo-alternar">blocos</span>
        </button>
      </div>
    </section>
  </div>
</body>
</html>
